<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/popup.css">
  <title>AI Memory</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="AI Memory" width="28" height="28">
        <h1>AI Memory</h1>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <div class="actions-bar">
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search conversations...">
      </div>
      <div class="action-buttons">
        <button id="saveNowBtn" class="btn btn-primary" title="Save current page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Save Now
        </button>
        <button id="exportBtn" class="btn btn-secondary" title="Export all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export
        </button>
        <button id="memoryFileBtn" class="btn btn-secondary" title="Download memory file for AI upload">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/>
            <polyline points="9 15 12 12 15 15"/>
          </svg>
          Memory File
        </button>
        <button id="uploadAllBtn" class="btn btn-accent" title="Open all AI platforms and sync missing memories">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload All
        </button>
      </div>
    </div>

    <div class="storage-warning" id="storageWarning" style="display: none;">
      <div class="warning-content">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <div class="warning-text">
          <strong>Storage <span id="storagePercent">0</span>% full</strong>
          <span id="storageDetail"></span>
        </div>
      </div>
      <button id="exportClearBtn" class="btn btn-warning">Export &amp; Clear</button>
    </div>

    <div class="settings-bar">
      <label class="toggle-row" title="Automatically paste your conversation history into new AI chats">
        <span class="toggle-label">Auto-load memory into new chats</span>
        <input type="checkbox" id="autoInjectToggle">
        <span class="toggle-switch"></span>
      </label>
      <label class="toggle-row" title="Show conversations that are already synced to all platforms">
        <span class="toggle-label">Show synced</span>
        <input type="checkbox" id="showSyncedToggle">
        <span class="toggle-switch"></span>
      </label>
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="claude">Claude</button>
      <button class="tab" data-filter="chatgpt">ChatGPT</button>
      <button class="tab" data-filter="gemini">Gemini</button>
      <button class="tab" data-filter="grok">Grok</button>
    </div>

    <div class="conversation-list" id="conversationList">
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>No saved conversations yet.</p>
        <p class="hint">Visit Claude, ChatGPT, Gemini, or Grok to start saving!</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
